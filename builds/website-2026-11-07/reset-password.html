<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Choose a new password · Coaster Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800;900&family=Nunito+Sans:opsz,wght@6..12,500;6..12,600;6..12,700;6..12,800&display=swap">
  <script type="module" crossorigin src="/assets/reset-password-NLjaFUY1.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/errors-C0-gHb0p.js">
  <link rel="modulepreload" crossorigin href="/assets/dom-Bvgdh18E.js">
  <link rel="modulepreload" crossorigin href="/assets/session-Do8Gvb96.js">
  <link rel="modulepreload" crossorigin href="/assets/validation-DuzclGvN.js">
  <link rel="stylesheet" crossorigin href="/assets/dom-CRQBdVPF.css">
</head>
<body>
<main class="auth">
  <a class="brand" href="./"><span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M4 36 H12 C17 36 16 14 24 14 C29 14 31 22 28 27 C25 32 18 29 20 23 C22 16 30 12 36 22 C39 28 40 36 44 36" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 41 H44" stroke="rgba(255,255,255,.55)" stroke-width="2.2" stroke-linecap="round"/></svg></span>COASTER LAB</a>

  <section class="card" aria-labelledby="title">
    <div id="loading-view" class="loading"><div class="spinner" aria-hidden="true"></div><p>Checking your reset link…</p></div>

    <div id="invalid-view" hidden>
      <h1>Link not working</h1>
      <p id="invalid-alert" class="alert" data-kind="error" role="alert"></p>
      <a class="btn btn-primary btn-block" href="forgot-password.html">Send me a new link</a>
      <p class="links center"><a href="login.html">Back to log in</a></p>
    </div>

    <div id="form-view" hidden>
      <h1 id="title">Choose a new password</h1>
      <p class="sub">Signed in as <strong id="who"></strong>.</p>
      <p id="alert" class="alert" hidden></p>
      <form id="reset-form" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <div class="pw"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="password-checks"></div>
          <ul id="password-checks" class="checks">
            <li data-check="length">At least 8 characters</li>
          </ul>
        </div>
        <div class="field">
          <label for="confirm">Type it again</label>
          <div class="pw"><input id="confirm" name="confirm" type="password" autocomplete="new-password" required></div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Save new password</button>
      </form>
    </div>

    <div id="done-view" hidden>
      <h1 tabindex="-1">Password changed ✅</h1>
      <p class="sub">Use your new password next time you log in.</p>
      <div class="row">
        <a class="btn btn-primary" href="simulator.html">Open the simulator</a>
        <a class="btn btn-ghost" href="account.html">My account</a>
      </div>
    </div>
  </section>
</main>
</body>
</html>
