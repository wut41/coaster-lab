if(def.tun){const b=ni(V(def.tun[0],def.tun[1],def.tun[2])),len=def.tun[3],n=Math.round(len/1.4),tm=mat(def.tunCol,.9),pc=mk(new THREE.BoxGeometry(.25,3,.25),tm,n*2),bc=mk(new THREE.BoxGeometry(2.6,.3,.3),tm,n);

S.crossVectors(U[b],T[b]);const cap=new THREE.Mesh(new THREE.IcosahedronGeometry(1,1),mat(def.env.rocks[1],.95));cap.position.copy(P[b]).addScaledVector(U[b],5.4);cap.quaternion.setFromRotationMatrix(M.makeBasis(S,U[b],T[b]));cap.scale.set(5,2.6,len*.6);cap.castShadow=true;rg.add(cap)}
}
// ---- train
const bodymat=mat(0x172941,.32,.35),red=mat(0xff453d,.28,.5),seatmat=mat(0x101a2c,.38,.1),wheelmat=mat(0x171b23,.3,.25),skin=mat(0xf0c29a,.7),shirts=[0x2f7dff,0xffd23f,0x2fd18b,0xff6fa8];

function makeCar(k){const car=new THREE.Group();box(car,.95,.28,1.02,bodymat,0,0,0);box(car,1,.13,1.05,red,0,.17,0);box(car,.72,.22,.78,seatmat,0,.36,-.02);box(car,.66,.05,.06,wheelmat,0,.5,.2);

const lamp=new THREE.PointLight(0xff6b40,1.5,8);lamp.position.set(0,.5,.9);const keep=new Set([grass,dark,railmat,crossmat,bodymat,red,seatmat,wheelmat,skin,hlMat]);

// ---- physics: chain lift to the first crest, then gravity + drag + rolling friction, brake zone before the station
const G=9.81,LIFT=3.8;let sCrest=0,BR=15,loopZ=null;
let rideT=0,vMax=0,cur=0,menuPrev=true,s=0,v=LIFT,playing=true,speed=1,camMode='chase',lightsOn=true,orbitYaw=0,orbitPitch=.24,zoom=1,headYaw=0,headPitch=0,snap=true,lastMode='';
function physics(dt){let n=4;const h=dt/n;while(n--){const i=Math.floor(((s%L)+L)%L/L*N)%N;

s+=v*h;if(s>=L){s-=L;rideT=0;vMax=0}}}
const pP=V(),pT=V(),pU=V(),pS=V(),tT=V(),tU=V(),la=V(),eye=V(),des=V(),look=V(),qT=new THREE.Quaternion(),rideQ=new THREE.Quaternion(),hq=new THREE.Quaternion(),eu=new THREE.Euler(0,0,0,'YXZ');
function pose(q,P_,T_,U_){const f=(((q%L)+L)%L)/L*N,i=Math.floor(f)%N,j=(i+1)%N,a=f-Math.floor(f);P_.lerpVectors(P[i],P[j],a);T_.lerpVectors(T[i],T[j],a).normalize();U_.lerpVectors(U[i],U[j],a);U_.addScaledVector(T_,-U_.dot(T_)).normalize()}
function updateCars(){cars.forEach((c,k)=>{pose(s-k*1.15,pP,pT,pU);pS.crossVectors(pU,pT);c.position.copy(pP).addScaledVector(pU,.3);c.quaternion.setFromRotationMatrix(M.makeBasis(pS,pU,pT))})}
let baseFov=58,rideFov=76;const setFov=f=>{const d=f-camera.fov;if(Math.abs(d)>.05){camera.fov+=d*.15;camera.updateProjectionMatrix()}};
function updateCamera(dt){pose(s,pP,pT,pU);const first=snap||camMode!==lastMode,k=first?1:1-Math.pow(.001,dt);
if(camMode==='ride'){eye.copy(pP).addScaledVector(pU,.95).addScaledVector(pT,.1);pose(s+5,la,tT,tU);M.lookAt(eye,la,pU);qT.setFromRotationMatrix(M);
if(first)rideQ.copy(qT);else rideQ.slerp(qT,1-Math.exp(-16*dt));hq.setFromEuler(eu.set(headPitch,headYaw,0));camera.position.copy(eye);camera.quaternion.copy(rideQ).multiply(hq);setFov(rideFov+Math.min(10,v*speed*.45))}
else{setFov(baseFov);const p=cars[0].position,t=pT;
if(camMode==='chase'){des.copy(p).addScaledVector(t,-8*zoom);des.y+=3.5*zoom;look.copy(p).addScaledVector(t,4);look.y+=1}
else if(camMode==='front'){des.copy(p).addScaledVector(t,7*zoom);des.y+=1.8*zoom;look.copy(p).addScaledVector(t,-3)}
else if(camMode==='side'){des.set(p.x+12*zoom,p.y+4*zoom,p.z+1);look.copy(p)}
else{const r=orR*zoom;des.set(oc.x+Math.cos(orbitYaw)*r,oc.y+Math.sin(orbitPitch)*r,oc.z+Math.sin(orbitYaw)*r);look.copy(oc);des.y=Math.max(des.y,1)}
camera.position.lerp(des,k);camera.lookAt(look)}
lastMode=camMode;snap=false}
// ---- HUD + UI
const eS=$('#speedRead'),eH=$('#heightRead'),eR=$('#rideRead'),eT=$('#timeRead'),eX=$('#maxRead'),setT=(e,t)=>{if(e.textContent!==t)e.textContent=t};let hudT=0;
function hud(dt){hudT-=dt;if(hudT>0)return;hudT=.1;const inLoop=loopZ&&s>=loopZ[0]&&s<=loopZ[1];
setT(eS,Math.round(v*2.237)+' mph');setT(eH,Math.max(0,Math.round((pP.y+.7)*3.28))+' ft');setT(eT,Math.floor(rideT/60)+':'+String(Math.floor(rideT%60)).padStart(2,'0'));setT(eX,Math.round(vMax*2.237)+' mph');setT(eR,!playing?'Paused':s<6?'Dispatch':s>L-4?'Station':s<sCrest-.5?'Lift hill':inLoop?'Loop':s>L-BR?'Braking':'Free roll')}
const toast=$('#toast');let toastTimer;function say(m){toast.textContent=m;toast.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.opacity=0,1800)}
function setPlay(b){playing=b;$('#play').textContent=b?'Ⅱ Pause ride':'▶ Resume ride';$('#playBottom').textContent=b?'Ⅱ':'▶'}
function togglePlay(){setPlay(!playing);say(playing?'Ride resumed':'Ride paused')}

const hint=$('.hint');
function setCam(m){camMode=m;document.querySelectorAll('[data-cam]').forEach(x=>x.classList.toggle('active',x.dataset.cam===m));hint.textContent=m==='ride'?'Front seat · drag to look around':'Drag to rotate · pinch to zoom · works on iPhone'}
$('#play').onclick=togglePlay;$('#playBottom').onclick=togglePlay;$('#reset').onclick=reset;$('#resetBottom').onclick=reset;
$('#speed').addEventListener('input',e=>{speed=+e.target.value;$('#speedLabel').textContent=speed.toFixed(2)+'×'});
document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>{setCam(b.dataset.cam);say('Camera: '+b.textContent.trim())});
$('#viewReset').onclick=()=>{headYaw=headPitch=0;orbitYaw=0;orbitPitch=.24;zoom=1;if(camMode!=='ride')setCam('chase');say('Camera view reset')};
$('#lights').onclick=()=>{lightsOn=!lightsOn;lamp.intensity=lightsOn?1.5:0;hlMat.emissiveIntensity=lightsOn?1.5:0;say(lightsOn?'Train lights on':'Train lights off')};
$('#layout').onclick=openMenu;$('#menuClose').onclick=closeMenu;
const el=renderer.domElement,ptr=new Map();let pinch=0;const pd=()=>{const a=[...ptr.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};

function resize(){camera.aspect=innerWidth/innerHeight;const m=innerWidth<650;baseFov=m?68:58;rideFov=m?82:76;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);prMax=prCap();pr=Math.min(pr,prMax);renderer.setPixelRatio(pr)}
addEventListener('resize',resize);resize();camera.fov=baseFov;camera.updateProjectionMatrix();
// adaptive resolution: step pixel ratio down if the frame rate stays low
// PERF-START
// Resolution stays between 1 and the device cap. Drops 0.25 after a slow 2 s window (<40 fps); rises 0.25 only after `need` consecutive good windows (>=55 fps).
// If a drop happens within 20 s of a rise, the rise failed: no further rise is tried for `gap` seconds (60, doubling up to 600), so a borderline device settles instead of flip-flopping.
let fpsT=-2,fpsN=0,good=0,need=3,lastUp=-99,clock=0,hold=0,gap=60;const prLo=()=>Math.min(1,prMax),applyPr=()=>{renderer.setPixelRatio(pr);renderer.setSize(innerWidth,innerHeight)};
function perf(raw){if(raw>.5)return;clock+=raw;fpsT+=raw;fpsN++;if(fpsT<2)return;const f=fpsN/fpsT;fpsT=0;fpsN=0;
if(f<40){good=0;if(pr>prLo()){pr=Math.max(prLo(),pr-.25);if(clock-lastUp<20){hold=clock+gap;gap=Math.min(gap*2,600)}applyPr()}}
else if(f>=55&&pr<prMax&&clock>=hold){if(++good>=need){good=0;pr=Math.min(prMax,pr+.25);lastUp=clock;applyPr()}}else good=0}
// PERF-END
let prev=performance.now(),dead=false;document.addEventListener('visibilitychange',()=>{prev=performance.now();fpsT=-2;fpsN=0;good=0;ptr.clear();pinch=0});
function animate(now){if(dead)return;requestAnimationFrame(animate);try{const raw=(now-prev)/1000,dt=Math.min(raw,.04);prev=now;
if(playing){physics(dt*speed);rideT+=dt*speed;vMax=Math.max(vMax,v)}updateCars();updateCamera(dt);hud(dt);clouds.forEach(c=>{c.position.x+=dt*.8;if(c.position.x>80)c.position.x=-80});perf(raw);renderer.render(scene,camera)}
catch(e){dead=true;console.error(e);fail('Something went wrong while drawing the ride. Reload to try again.')}}

// ---- ride system: generic scenery, station, ride switching, menu
function envGen(d){const e=d.env,[x0,x1,z0,z1]=bb,gm=new THREE.Mesh(new THREE.PlaneGeometry(500,500),mat(e.ground,.95));gm.rotation.x=-Math.PI/2;gm.position.y=-.7;gm.receiveShadow=true;rg.add(gm);
const scat=(n,g,col,a,b,sy,m,R)=>{if(!n)return;const im=new THREE.InstancedMesh(g,mat(col,.95),n),q=new THREE.Quaternion();for(let i=0;i<n;i++){let x,z;do{x=x0-R+rnd()*(x1-x0+2*R);z=z0-R+rnd()*(z1-z0+2*R)}while(x>x0-m&&x<x1+m&&z>z0-m&&z<z1+m);const k=a+rnd()*(b-a);q.setFromAxisAngle(V(0,1,0),rnd()*6.28);im.setMatrixAt(i,M.compose(V(x,-.7,z),q,V(k,k*sy,k)))}im.castShadow=a<=9;rg.add(im)};
scat(e.rocks[0],new THREE.IcosahedronGeometry(1,0).translate(0,.4,0),e.rocks[1],1,3.5,.8,5,22);scat(e.walls[0],new THREE.IcosahedronGeometry(1,0).translate(0,.4,0),e.walls[1],9,20,1.7,16,70);
scat(e.trees[0],new THREE.ConeGeometry(.7,2,6).translate(0,1,0),e.trees[1],.8,1.7,1,4,28);scat(e.peaks[0],new THREE.ConeGeometry(1,2.2,6).translate(0,1.1,0),e.peaks[1],22,42,1,60,140)}
function station(d){pose(5,pP,pT,pU);pS.crossVectors(pU,pT);const g=new THREE.Group();g.position.copy(pP);g.quaternion.setFromRotationMatrix(M.makeBasis(pS,pU,pT));box(g,2.2,1.2,8,mat(0xb8c4d0,.8),2.2,-1.1,0);box(g,3,.15,8.6,mat(d.accent,.5),2.2,2.4,0);for(const z of[-3.9,3.9])box(g,.14,2.9,.14,dark,3.4,.95,z);rg.add(g)}
function disposeRG(g){g.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.isInstancedMesh)o.dispose();[].concat(o.material||[]).forEach(m=>{if(!keep.has(m))m.dispose()})});scene.remove(g)}
function selectRide(i){const d=RIDES[i];if(rg)disposeRG(rg);rg=new THREE.Group();scene.add(rg);cur=i;clouds=[];seed=7;
setSky(d.sky[0],d.sky[1],d.sky[2],d.fog,d.fogFar);buildTrack(d);if(d.env){envGen(d);station(d)}else envLA();buildCars(d);
oc.set(d.center[0],d.center[1],d.center[2]);orR=d.orbitR;const sc=sun.shadow.camera;sc.left=sc.bottom=-d.shadow;sc.right=sc.top=d.shadow;sc.far=d.shadow*3+40;sc.updateProjectionMatrix();sun.position.set(oc.x-20,45,oc.z+20);sun.target.position.set(oc.x,0,oc.z);sun.target.updateMatrixWorld();
s=0;v=LIFT;rideT=0;vMax=0;snap=true;setPlay(true);$('#rideName').textContent=d.name;document.querySelectorAll('.card').forEach((c,k)=>c.classList.toggle('sel',k===i))}
function sampleTrack(d){const c=new THREE.CatmullRomCurve3(d.pts.map(p=>V(p[0],p[1],p[2])),true,'centripetal'),l=c.getLength(),p=c.getSpacedPoints(N).slice(0,N);return{P:p,L:l,T:p.map((q,i)=>p[(i+1)%N].clone().sub(p[(i+N-1)%N]).normalize())}}
function analyze(d){const k=sampleTrack(d);P=k.P;T=k.T;L=k.L;let ic=0;for(let i=1;i<N;i++)if(P[i].y>P[ic].y)ic=i;sCrest=ic*L/N;BR=d.brake;s=0;v=LIFT;let t=0,vm=0,mh=-9;P.forEach(p=>{mh=Math.max(mh,p.y)});
for(;t<240;t+=.01){const sb=s;physics(.01);vm=Math.max(vm,v);if(s<sb)break}s=0;v=LIFT;
const xs=P.map(p=>p.x),x0=Math.min(...xs),sx=116/(Math.max(...xs)-x0),sy=40/(mh+.7);let pr='';for(let i=0;i<N;i+=6)pr+=(i?'L':'M')+(2+(P[i].x-x0)*sx).toFixed(1)+' '+(42-(P[i].y+.7)*sy).toFixed(1);
return{h:(mh+.7)*3.28,len:L*3.28,t,vm:vm*2.237,pr,inv:d.loop?1:0}}
function buildMenu(){const st=RIDES.map(analyze);$('#cards').innerHTML=RIDES.map((d,i)=>{const a=st[i];return `<div class="card" role="button" data-i="${i}" style="--c:${d.color}"><svg viewBox="0 0 120 44" preserveAspectRatio="none"><path d="${a.pr}" fill="none" stroke="${d.color}" stroke-width="2" stroke-linejoin="round"/></svg><b>${d.name}</b><small>${d.type}</small><i>Max height ${Math.round(a.h)} ft · Track ${Math.round(a.len)} ft<br>Lap ≈ ${Math.round(a.t)} s · Top speed ≈ ${Math.round(a.vm)} mph · Inversions ${a.inv}<br>(estimated from the track model)</i></div>`}).join('');
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{$('#menu').hidden=true;selectRide(+c.dataset.i);say('Now riding: '+RIDES[cur].name)})}
function openMenu(){menuPrev=playing;setPlay(false);$('#menu').hidden=false}

buildMenu();selectRide(0);
requestAnimationFrame(animate);
