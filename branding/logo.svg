<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#9be1ff"/>
      <stop offset="0.6" stop-color="#4fb3f6"/>
      <stop offset="1" stop-color="#2479d6"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#7a2cff"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d6ff"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d75"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="flaskClip">
      <path d="M445 150 H555 V300 L720 590 Q745 640 690 650 H310 Q255 640 280 590 L445 300 Z"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="500" cy="430" r="330" fill="#ffffff" opacity="0.25" filter="url(#glow)"/>

  <g transform="translate(500 500) scale(0.84) translate(-500 -500)">
  <!-- stars / sparkles -->
  <g fill="#ffffff">
    <circle cx="210" cy="230" r="5" opacity=".8"/>
    <circle cx="800" cy="200" r="4" opacity=".7"/>
    <circle cx="160" cy="430" r="3" opacity=".6"/>
    <circle cx="850" cy="430" r="5" opacity=".8"/>
    <circle cx="300" cy="120" r="3" opacity=".5"/>
    <circle cx="720" cy="110" r="3" opacity=".5"/>
    <path d="M770 300 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z" fill="#ffd400"/>
    <path d="M225 330 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#ffffff"/>
  </g>

  <path d="M445 150 H555 V300 L720 590 Q745 640 690 650 H310 Q255 640 280 590 L445 300 Z" fill="#ffffff" fill-opacity=".18" stroke="#070418" stroke-width="34" stroke-linejoin="round"/>
  <rect x="412" y="120" width="176" height="46" rx="23" fill="#070418"/>
  <!-- flask liquid -->
  <g clip-path="url(#flaskClip)">
    <path d="M200 480 Q300 455 400 480 T600 480 T800 480 V700 H200 Z" fill="url(#liquid)" opacity=".95"/>
    <g fill="#ffffff" opacity=".55">
      <circle cx="350" cy="590" r="12"/>
      <circle cx="400" cy="540" r="7"/>
      <circle cx="620" cy="600" r="15"/>
      <circle cx="660" cy="545" r="8"/>
      <circle cx="560" cy="625" r="6"/>
    </g>
  </g>
  <!-- flask outline -->
  <path d="M445 150 H555 V300 L720 590 Q745 640 690 650 H310 Q255 640 280 590 L445 300 Z"
        fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="round"/>
  <rect x="420" y="128" width="160" height="30" rx="15" fill="#ffffff"/>
  <!-- glass shine -->
  <path d="M470 175 V305 L330 560" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".35"/>
  <!-- bubbles rising out of neck -->
  <g fill="none" stroke="#ffffff" stroke-width="6">
    <circle cx="530" cy="95" r="14"/>
    <circle cx="480" cy="60" r="9"/>
    <circle cx="545" cy="40" r="6"/>
  </g>

  <!-- coaster track with vertical loop -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="track" d="M60 700 C220 700 360 610 500 600 A115 115 0 1 0 500 370 A115 115 0 0 0 470 596 C620 612 760 690 940 690"
          stroke="#070418" stroke-width="46"/>
    <path d="M60 700 C220 700 360 610 500 600 A115 115 0 1 0 500 370 A115 115 0 0 0 470 596 C620 612 760 690 940 690"
          stroke="#ffd400" stroke-width="32"/>
    <path d="M60 700 C220 700 360 610 500 600 A115 115 0 1 0 500 370 A115 115 0 0 0 470 596 C620 612 760 690 940 690"
          stroke="#b36b00" stroke-width="32" stroke-dasharray="6 16" stroke-linecap="butt"/>
    <path d="M60 700 C220 700 360 610 500 600 A115 115 0 1 0 500 370 A115 115 0 0 0 470 596 C620 612 760 690 940 690"
          stroke="#fff3a6" stroke-width="5" opacity=".9"/>
  </g>

  <!-- coaster car riding the track, riders with hands up -->
  <g transform="translate(732 646) rotate(14.5)">
    <g stroke="#070418" stroke-width="6" stroke-linecap="round">
      <path d="M-30 -48 L-40 -78" /><path d="M-14 -48 L-6 -80"/>
      <path d="M14 -48 L6 -80" /><path d="M30 -48 L40 -78"/>
    </g>
    <g stroke="#ffd9b3" stroke-width="3" stroke-linecap="round">
      <path d="M-30 -48 L-40 -78" /><path d="M-14 -48 L-6 -80"/>
      <path d="M14 -48 L6 -80" /><path d="M30 -48 L40 -78"/>
    </g>
    <circle cx="-22" cy="-46" r="14" fill="#ffd9b3" stroke="#070418" stroke-width="5"/>
    <circle cx="22" cy="-46" r="14" fill="#ffd9b3" stroke="#070418" stroke-width="5"/>
    <path d="M-62 -34 H58 Q74 -34 74 -18 V-6 Q74 6 62 6 H-58 Q-70 6 -70 -6 V-26 Q-70 -34 -62 -34Z" fill="#ff2d75" stroke="#070418" stroke-width="7"/>
    <path d="M-56 -24 H50" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".6"/>
    <circle cx="-42" cy="10" r="9" fill="#ffffff" stroke="#070418" stroke-width="5"/>
    <circle cx="42" cy="10" r="9" fill="#ffffff" stroke="#070418" stroke-width="5"/>
  </g>

  <!-- wordmark -->
  <text x="500" y="828" text-anchor="middle" font-family="Inter Display, Inter" font-weight="900"
        font-size="148" letter-spacing="2" fill="#070418" stroke="#070418" stroke-width="26" stroke-linejoin="round">COASTER</text>
  <text x="500" y="828" text-anchor="middle" font-family="Inter Display, Inter" font-weight="900"
        font-size="148" letter-spacing="2" fill="url(#txt)">COASTER</text>
  <rect x="355" y="848" width="290" height="96" rx="48" fill="url(#pill)" stroke="#070418" stroke-width="8"/>
  <text x="500" y="920" text-anchor="middle" font-family="Inter Display, Inter" font-weight="900"
        font-size="80" letter-spacing="14" fill="#ffffff">LAB</text>
  </g>
</svg>
