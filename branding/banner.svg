  <!-- the O is a coaster loop -->
  <g><path d="M1216.6 720.8 Q1244.9 720.8 1268.0 716.9 A53.9 53.9 0 1 0 1268.0 609.1 A53.9 53.9 0 0 0 1260.3 716.4 Q1291.1 720.8 1319.4 720.8" fill="none" stroke="#070418" stroke-width="41.1" stroke-linecap="round" stroke-linejoin="round" /><path d="M1216.6 720.8 Q1244.9 720.8 1268.0 716.9 A53.9 53.9 0 1 0 1268.0 609.1 A53.9 53.9 0 0 0 1260.3 716.4 Q1291.1 720.8 1319.4 720.8" fill="none" stroke="#ffd400" stroke-width="24.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M1216.6 720.8 Q1244.9 720.8 1268.0 716.9 A53.9 53.9 0 1 0 1268.0 609.1 A53.9 53.9 0 0 0 1260.3 716.4 Q1291.1 720.8 1319.4 720.8" fill="none" stroke="#d18f00" stroke-width="24.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3.9 15.4" stroke-linecap="butt"/><path d="M1216.6 720.8 Q1244.9 720.8 1268.0 716.9 A53.9 53.9 0 1 0 1268.0 609.1 A53.9 53.9 0 0 0 1260.3 716.4 Q1291.1 720.8 1319.4 720.8" fill="none" stroke="#fff8c4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" /></g>
