name: ✨ Feature idea
description: Suggest something new for Coaster Lab.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should players be able to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: Who is it for, and what problem does it solve?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rides
        - Track Builder
        - My Park
        - Accounts / sharing
        - Graphics / sound
        - Other
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps existing rides, saves and settings working.
        - label: This works on iPhone.
