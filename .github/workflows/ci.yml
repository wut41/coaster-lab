# Fast checks on every push and pull request. No game code is executed.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Rebuild 10.1 from src/v10 and syntax-check it
        run: node build.mjs --check
      - name: The committed 10.1 build matches its sources
        run: |
          if ! git diff --quiet -- coaster_lab_v10_1.html; then
            echo "::error file=coaster_lab_v10_1.html::coaster_lab_v10_1.html is out of date. Run 'node build.mjs' and commit the result."
            git diff --stat -- coaster_lab_v10_1.html
            exit 1
          fi
      - name: Syntax-check every single-file build
        run: |
          shopt -s nullglob
          node tools/ci/check-html-syntax.mjs coaster_lab_v*.html backup/*.html builds/*.html builds/legacy/*.html
      - name: Syntax-check test and tool scripts
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(find build.mjs tests tools -path '*/node_modules' -prune -o -type f \( -name '*.js' -o -name '*.mjs' \) -print)
          exit $fail

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan tracked files
        run: python3 tools/ci/secret-scan.py
      - name: Scan full history (all fetched branches)
        run: python3 tools/ci/secret-scan.py --history

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Row level security and permission tests on a throw-away PostgreSQL (nothing reaches Supabase)
        run: bash supabase/tests/run.sh payments

  # The same tests on PostgreSQL 17, the version production runs (17.11 on 2026-11-27). The runner image ships 16, so
  # 17 comes from the PostgreSQL project's own apt repository. Free on a public repository; no Supabase branch needed.
  database-pg17:
    name: database (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install PostgreSQL 17 (server binaries only, no cluster started)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17
      - name: Row level security, permission and release-attack tests on PostgreSQL 17 (nothing reaches Supabase)
        env:
          PGBIN: /usr/lib/postgresql/17/bin
        run: |
          "$PGBIN/postgres" --version | grep -E ' 17\.' || { echo "::error::PostgreSQL 17 is not what PGBIN points at"; exit 1; }
          bash supabase/tests/run.sh payments

  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: package-lock.json matches package.json and every package has an integrity hash
        working-directory: tests
        run: |
          npm ci --ignore-scripts
          node -e "const l=require('./package-lock.json');const bad=Object.entries(l.packages).filter(([k,v])=>k&&!v.integrity);if(bad.length){console.error('no integrity:',bad.map(b=>b[0]));process.exit(1)}console.log(Object.keys(l.packages).length-1,'packages locked')"
