# Headless-browser regression tests (tests/). Dependencies come from tests/package-lock.json (`npm ci`), so every run
# uses the same Playwright, Chromium, three.js and jsdom versions.
#   release-10.10.1  the current build (builds/coaster_lab_v10_10_1.html): every pull request into main, pushes to
#                    main, weekly and on demand. This is the required check for main.
#   full-history     every suite against the 10.1 source build (coaster_lab_v10_1.html): weekly and on demand.
name: Regression

on:
  workflow_dispatch:
    inputs:
      target:
        description: "release (10.10.1), full (10.1 history), or one suite file such as t20_security.js"
        required: false
        default: release
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"   # Mondays 07:17 UTC

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: regression 10.10.1
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target != 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install test dependencies (exact versions from the lockfile)
        run: npm ci
      - name: Install Chromium (the build pinned by the locked Playwright)
        run: npx playwright install --with-deps chromium
      - name: Check the 10.10.1 build is the archived one
        working-directory: .
        run: echo "33587874273c2516c9d7798a732078dea8dc22bf60663f3a05ac857715f6f856  builds/coaster_lab_v10_10_1.html" | sha256sum -c -
      - name: Run
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          case "$TARGET" in
            ""|release) npm run test:release ;;
            t*.js) CL_F="$GITHUB_WORKSPACE/builds/coaster_lab_v10_10_1.html" node "$TARGET" ;;
            *) echo "unknown target: $TARGET"; exit 1 ;;
          esac
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regression-10.10.1
          path: tests/shots/
          if-no-files-found: ignore
          retention-days: 14

  full:
    name: regression full history (10.1)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regression-full
          path: tests/shots/
          if-no-files-found: ignore
          retention-days: 14
