# Keeps the pinned GitHub Actions (and the test tooling) up to date with reviewed PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    target-branch: develop
    commit-message: { prefix: "chore(ci)" }
  - package-ecosystem: npm
    directory: /tests
    schedule: { interval: monthly }
    target-branch: develop
    commit-message: { prefix: "chore(tests)" }
    ignore:
      # the tests serve three.js in place of the CDN copy the game loads (three@0.160.0): it must stay equal to the game's
      - dependency-name: "three"
